name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the solver instrument
        run: python -m compileall -q nextgen_probe
      - name: Record completeness check
        run: |
          for f in NOVEMBER_CONVERSION_PACKET.md SIEVE_REDESIGN_COMMISSION_2026-11-07.md; do
            test -f "$f" || { echo "missing record document: $f"; exit 1; }
          done
          echo "record documents present"
